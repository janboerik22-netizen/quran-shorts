name: Quran Shorts Bot

on:
 schedule:
   - cron: '0 7 * * *'
 workflow_dispatch:

jobs:
 upload:
   runs-on: ubuntu-latest
   timeout-minutes: 60

   steps:
     - name: Checkout code
       uses: actions/checkout@v4
       with:
         token: ${{ secrets.GITHUB_TOKEN }}

     - name: Voortgang herstellen
       uses: actions/cache@v4
       with:
         path: voortgang.json
         key: voortgang-${{ github.run_number }}
         restore-keys: voortgang-

     - name: Python instellen
       uses: actions/setup-python@v5
       with:
         python-version: '3.11'

     - name: FFmpeg instellen
       uses: FedericoCarboni/setup-ffmpeg@v3

     - name: Afhankelijkheden installeren
       run: pip install requests

     - name: Bot draaien
       env:
         YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
         YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
         YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
       run: python quran_bot.py

     - name: Voortgang opslaan
       if: always()
       uses: actions/cache/save@v4
       with:
         path: voortgang.json
         key: voortgang-${{ github.run_number }}
