name: Quran Shorts Bot

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Voortgang herstellen
        uses: actions/cache@v4
        with:
          path: voortgang.json
          key: voortgang-${{ github.run_number }}
          restore-keys: voortgang-

      - name: Python en FFmpeg instellen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python --version
          ffmpeg -version | head -1

      - name: Afhankelijkheden installeren
        run: pip install requests

      - name: Bot draaien
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python quran_bot.py

      - name: Voortgang opslaan
        if: always()
        uses: actions/cache/save@v4
        with:
          path: voortgang.json
          key: voortgang-${{ github.run_number }}
