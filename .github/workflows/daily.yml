name: Quran Shorts

on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 13 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen renderen, niet uploaden"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Systeempakketten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ffmpeg libraqm0 fonts-hosny-amiri fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Demo-render als preflight
        run: python quran_shorts.py --demo

      - name: Short maken en posten
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python quran_shorts.py --count 1 --dry-run
          else
            python quran_shorts.py --count 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-${{ github.run_number }}
          path: output/
          retention-days: 14

      - name: Voortgang bewaren
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add voortgang.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: voortgang"
          git pull --rebase
          git push
